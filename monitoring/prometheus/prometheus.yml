global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 自监控
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OpsPilot 后端业务指标
  - job_name: opspilot-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # 主机系统指标（Exporter 模式）
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
