apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: opspilot
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: opspilot-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://opspilot:opspilot@postgres:5432/opspilot
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: ALERT_EVAL_INTERVAL
              value: "10"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: opspilot
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
