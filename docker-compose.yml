services:
  postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: opspilot-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://opspilot:opspilot@postgres:5432/opspilot
      REDIS_URL: redis://redis:6379/0
      ALERT_EVAL_INTERVAL: "10"
      # 告警通知 webhook（钉钉/飞书机器人地址），留空则只写日志
      ALERT_WEBHOOK_URL: ""
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  agent:
    build: ./agent
    container_name: opspilot-agent
    environment:
      BACKEND_URL: http://backend:8000/api/v1/metrics
      INTERVAL: "10"
    depends_on:
      - backend
    restart: unless-stopped

  # ===== 监控体系（Phase 4）=====

  # 指标采集与时序存储
  prometheus:
    image: prom/prometheus:latest
    container_name: opspilot-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  # 主机系统指标采集器（Exporter 模式）
  node-exporter:
    image: prom/node-exporter:latest
    container_name: opspilot-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    restart: unless-stopped

  # 可视化大盘
  grafana:
    image: grafana/grafana:latest
    container_name: opspilot-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:
